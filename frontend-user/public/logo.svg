<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" role="img" aria-labelledby="title desc">
  <title id="title">Private Drive Pro</title>
  <desc id="desc">Nube azul con candado y el nombre Private Drive Pro</desc>
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e5ff"/>
      <stop offset=".48" stop-color="#087bff"/>
      <stop offset="1" stop-color="#123dbb"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8d9ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(10 14)" filter="url(#glow)">
    <path d="M31 91h98c20 0 35-14 35-32 0-17-13-30-30-32C127 8 108 0 87 0 61 0 40 16 34 39 14 41 0 55 0 73c0 10 8 18 31 18Z" fill="#071a3d" stroke="url(#cloud)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M61 48V36c0-14 10-24 23-24s23 10 23 24v12" fill="none" stroke="url(#lock)" stroke-width="9" stroke-linecap="round"/>
    <rect x="51" y="43" width="66" height="55" rx="12" fill="url(#lock)" stroke="#53cfff" stroke-width="3"/>
    <circle cx="84" cy="65" r="7" fill="#08234d"/>
    <path d="M84 70v12" stroke="#08234d" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="205" y="75" font-size="43" letter-spacing="1.5" fill="#eaf4ff">PRIVATE DRIVE</text>
    <text x="207" y="119" font-size="39" letter-spacing="5" fill="#16bfff">PRO</text>
  </g>
</svg>

